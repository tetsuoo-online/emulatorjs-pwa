<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="description" content="EmulatorJS en PWA : joue aux classiques NES, SNES, GBA, Genesis… depuis une ROM sur ton téléphone.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>RetroPlay</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#050506;color:#cde;font:15px system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}

  /* ---- Écran d'accueil ---- */
  #home{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px;max-width:680px;width:100%;text-align:center}
  #home h1{margin:0;font-size:clamp(1.6rem,6vw,2.4rem);letter-spacing:.04em;color:#7CFC00;text-shadow:0 0 18px #7CFC0055}
  #home p{margin:0;color:#8a8a90;line-height:1.5}
  .logo{width:clamp(72px,18vw,110px);height:clamp(72px,18vw,110px);border-radius:18px;background:#0d0d10;border:1px solid #1f1f24;display:grid;place-items:center;box-shadow:0 0 30px #7CFC0022 inset}
  .logo svg{width:62%;height:62%}

  select,button{background:#1b1b1fcc;color:#ddd;border:1px solid #3a3a40;border-radius:10px;padding:11px 14px;font:inherit;cursor:pointer;min-height:44px}
  select:focus,button:focus{outline:1px solid #7CFC00}
  button:active{background:#333}
  button.primary{background:#7CFC0018;border-color:#7CFC0066;color:#b6fca0;font-weight:600}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
  .row label{display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-size:11px;color:#777}
  .row select,.row button{width:100%}

  /* ---- Zone de jeu ---- */
  /* #exitBtn en top-LEFT pour ne pas écraser le bouton ☰ d'EmulatorJS (top-right),
     seul moyen sur mobile de rappeler les options après l'auto-hide de la barre basse. */
  #game{position:fixed;inset:0;display:none}
  #game.show{display:block}
  #exitBtn{position:fixed;top:calc(6px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));z-index:50;background:#000a;border:1px solid #333;border-radius:8px;padding:6px 10px;font-size:12px;display:none;min-height:34px}
  #game.show ~ #exitBtn{display:block}

  /* ---- Bouton Réglages + panneau (visibles sur l'accueil, masqués en jeu) ---- */
  #bSettings{position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));z-index:30;background:#000a;border:1px solid #333;border-radius:8px;padding:6px 12px;font-size:15px;min-height:34px;line-height:1}
  #game.show ~ #bSettings{display:none}
  #settings{position:fixed;inset:0;z-index:60;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px}
  .settings-card{background:#0d0d10;border:1px solid #2a2a30;border-radius:14px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 40px #0009}
  .settings-card h2{margin:0;font-size:1.1rem;color:#7CFC00}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .set-row span{font-size:14px;color:#bbb}
  .set-info{font-size:12px;color:#666;line-height:1.5;margin:0}
  .settings-card button{align-self:flex-end}

  [hidden]{display:none!important}
</style>
</head>
<body>

<div id="home">
  <div class="logo">
    <svg viewBox="0 0 11 8" shape-rendering="crispEdges" aria-hidden="true">
      <g fill="#7CFC00">
        <rect x="2" y="0" width="1" height="1"/><rect x="8" y="0" width="1" height="1"/>
        <rect x="3" y="1" width="1" height="1"/><rect x="7" y="1" width="1" height="1"/>
        <rect x="2" y="2" width="7" height="1"/>
        <rect x="1" y="3" width="2" height="1"/><rect x="4" y="3" width="3" height="1"/><rect x="8" y="3" width="2" height="1"/>
        <rect x="0" y="4" width="11" height="1"/>
        <rect x="0" y="5" width="1" height="1"/><rect x="2" y="5" width="7" height="1"/><rect x="10" y="5" width="1" height="1"/>
        <rect x="0" y="6" width="1" height="1"/><rect x="2" y="6" width="1" height="1"/><rect x="8" y="6" width="1" height="1"/><rect x="10" y="6" width="1" height="1"/>
        <rect x="3" y="7" width="2" height="1"/><rect x="6" y="7" width="2" height="1"/>
      </g>
    </svg>
  </div>
  <h1>RetroPlay</h1>

  <div class="row">
    <label>
      <select id="sys">
        <option value="arcade">Arcade (FBNeo)</option>
        <option value="pce">PC-Engine / TurboGrafx-16</option>
        <option value="segaMD">Mega Drive</option>
        <option value="snes">SNES</option>
        <option value="nes">NES / Famicom</option>
        <option value="gba">Game Boy Advance</option>
        <option value="gb">Game Boy</option>
        <option value="segaMS">Master System</option>
        <option value="segaGG">Game Gear</option>
      </select>
    </label>
  </div>

  <div class="row">
    <button class="primary" id="bRom" data-i18n="rom_btn">📁 Choisir une ROM</button>
  </div>
  <p style="font-size:12px;color:#666" data-i18n="rom_privacy">La ROM reste sur ton appareil — rien n'est téléversé.</p>

  <!-- Mises à jour : un bouton "Màj disponible" s'insère ici automatiquement
       quand un nouveau SW attend. + un petit lien de vérification manuelle. -->
  <div id="updSlot" style="min-height:0"></div>
  <button id="bUpd" data-i18n="check_updates" style="margin-top:0px;padding:5px 10px;font-size:11px;min-height:auto;background:#14141ccc;border-color:#2a2a2e;color:#888">🔄 Vérifier les mises à jour</button>
</div>

<div id="game"></div>
<button id="exitBtn" title="Quitter le jeu">✕</button>
<button id="bSettings" title="Réglages">⚙️</button>
<input id="romIn" type="file" accept=".nes,.sfc,.smc,.gba,.gbc,.gb,.md,.smd,.sms,.gg,.bin,.iso,.cue,.ccd,.chd,.img,.pce,.zip,.7z" hidden>

<!-- Panneau Réglages -->
<div id="settings" hidden>
  <div class="settings-card">
    <h2 data-i18n="settings_title">Réglages</h2>
    <label class="set-row">
      <span data-i18n="settings_lang">Langue</span>
      <select id="langSel">
        <option value="fr">Français</option>
        <option value="en">English</option>
      </select>
    </label>
    <p class="set-info" data-i18n="settings_save_info">Sauvegarde d'état : fichiers .state uniques (horodatés) — plus d'écrasement.</p>
    <p class="set-info" id="setVersion" style="text-align:center;opacity:.6;margin-top:-4px"></p>
    <button id="settingsClose" data-i18n="settings_close">Fermer</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let romBlob = null, romName = '', started = false;
const VERSION = '2.1';
const DATA_URL = new URL('./data/', document.baseURI);

// ---- i18n FR/EN (l'UI d'EmulatorJS reste en anglais : fr-FR.json absent du data/ local) ----
const STRINGS = {
  fr: {
    rom_btn:'📁 Choisir une ROM', rom_privacy:"La ROM reste sur ton appareil — rien n'est téléversé.",
    check_updates:'🔄 Vérifier les mises à jour', update_available:'⬇ Mise à jour disponible — installer',
    exit_title:'Quitter le jeu', settings_title:'Réglages', settings_lang:'Langue',
    settings_save_info:"Sauvegarde d'état : fichiers .state uniques (horodatés) — plus d'écrasement.",
    settings_close:'Fermer',
    core_detected:'Cœur détecté : ', core_using:'Cœur : ', core_manual:' (sélection manuelle)',
    loading_ejs:"Chargement d'EmulatorJS… (1re fois : ~2-8 Mo)",
    load_failed:"Échec du chargement d'EmulatorJS (réseau ?). Réessaie.",
    check_done:'Vérification effectuée', check_failed:'Vérification impossible',
    state_saved:'État sauvegardé : ', state_load_pick:'Choisis un fichier .state',
    state_load_ok:'État chargé', state_load_err:"Échec du chargement de l'état",
  },
  en: {
    rom_btn:'📁 Choose ROM', rom_privacy:'ROM stays on your device — nothing is uploaded.',
    check_updates:'🔄 Check for updates', update_available:'⬇ Update available — install',
    exit_title:'Exit game', settings_title:'Settings', settings_lang:'Language',
    settings_save_info:'State save: unique timestamped .state files — no more overwriting.',
    settings_close:'Close',
    core_detected:'Core detected: ', core_using:'Core: ', core_manual:' (manual)',
    loading_ejs:'Loading EmulatorJS… (first time: ~2-8 MB)',
    load_failed:'Failed to load EmulatorJS (network?). Try again.',
    check_done:'Check complete', check_failed:'Check failed',
    state_saved:'State saved: ', state_load_pick:'Choose a .state file',
    state_load_ok:'State loaded', state_load_err:'Failed to load state',
  },
};
let lang = localStorage.getItem('rp_lang') || 'fr';
function t(k){ return (STRINGS[lang] && STRINGS[lang][k]) || STRINGS.fr[k] || k; }
function applyStrings(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  const ls = $('langSel'); if (ls) ls.value = lang;
  $('exitBtn').title = t('exit_title');
  $('bSettings').title = t('settings_title');
}
function setLang(l){ lang = l; localStorage.setItem('rp_lang', l); applyStrings(); }

// ---- Panneau Réglages ----
$('bSettings').onclick = () => { $('settings').hidden = false; };
$('settingsClose').onclick = () => { $('settings').hidden = true; };
$('settings').onclick = e => { if (e.target === $('settings')) $('settings').hidden = true; };
$('langSel').onchange = e => setLang(e.target.value);
applyStrings();
$('setVersion').textContent = 'Version ' + VERSION;

// ---- Save/Load state : noms uniques horodatés (plus d'écrasement) ----
// EmulatorJS appelle callEvent("saveState",{state,...}) au clic sur le bouton Save.
// Si un handler est enregistré via EJS_emulator.on("saveState",fn), callEvent
// retourne >0 et le code SAUTE la sauvegarde par défaut (slot browser unique OU
// fichier à nom fixe → écrasement). On génère donc un .state horodaté unique.
// Symétrique pour loadState : on remplace par un sélecteur de fichier.
function tsStamp(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
}
function downloadBytes(bytes, filename){
  const url = URL.createObjectURL(new Blob([bytes]));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function pickStateFile(){
  return new Promise(res => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.state';
    inp.onchange = () => res(inp.files[0] || null);
    inp.click();
  });
}
function registerStateHooks(emu){
  if (!emu || typeof emu.on !== 'function') return;
  emu.on('saveState', (e) => {
    if (!e || !e.state) return;
    const base = (window.EJS_gameName || 'game').replace(/[^a-z0-9._-]/gi,'');
    const name = base + '-' + tsStamp() + '.state';
    downloadBytes(e.state, name);
    say(t('state_saved') + name, 6000);
  });
  emu.on('loadState', async () => {
    say(t('state_load_pick'), 8000);
    const f = await pickStateFile();
    if (!f) return;
    try {
      const bytes = new Uint8Array(await f.arrayBuffer());
      emu.gameManager.loadState(bytes);
      say(t('state_load_ok'));
    } catch (err) { console.warn(err); say(t('state_load_err')); }
  });
}

// ---- Sélecteur de ROM ----
// Mappe extension → EJS_core pour éviter tout mismatch core/ROM
// (qui ferait retomber EmulatorJS sur le menu XMB RetroArch au lieu de lancer le jeu).
// Sources ambigües (.bin, .iso, .zip, .7z) : on garde le cœur choisi dans le select.
const EXT_TO_CORE = {
  nes: 'nes',     sfc: 'snes',    smc: 'snes',   gba: 'gba',     gbc: 'gb',
  gb:  'gb',
  md:  'segaMD',  smd: 'segaMD',  sms: 'segaMS', gg:  'segaGG',
  pce: 'pce',
  // Arcade (fbneo) : pas d'auto-détection — les ROMs sont des .zip génériques
  // (le nom du zip = le ROM set). L'utilisateur doit sélectionner "Arcade" manuellement.
};
const CORE_LABEL = {
  nes:'NES', snes:'SNES', gba:'GBA', gb:'Game Boy',
  segaMD:'Mega Drive', segaMS:'Master System', segaGG:'Game Gear',
  arcade:'Arcade (FBNeo)', pce:'PC-Engine / TurboGrafx',
};
function extOf(name) {
  const m = name.toLowerCase().match(/\.([a-z0-9]+)$/);
  return m ? m[1] : '';
}
$('bRom').onclick = () => $('romIn').click();
$('romIn').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  romBlob = f; romName = f.name;
  // Auto-détection du cœur depuis l'extension si elle est non-ambiguë.
  const core = EXT_TO_CORE[extOf(romName)];
  if (core) {
    $('sys').value = core;
    say(t('core_detected') + (CORE_LABEL[core] || core));
  } else {
    // .zip/.7z = conteneurs génériques, .bin/.iso/.cue/.chd = multi-systèmes :
    // impossible de deviner le cœur, on utilise celui choisi dans le select.
    say(t('core_using') + (CORE_LABEL[$('sys').value] || $('sys').value) + t('core_manual'));
  }
  start();
};

// ---- Lancement du jeu ----
// IMPORTANT : loader.js lit window.EJS_* au moment où il s'exécute (ligne 14 et 82-150).
// Ne PAS le charger via une balise <script> statique en haut de page : il tournerait
// avant que EJS_pathtodata / EJS_gameUrl / EJS_player ne soient définis, retomberait
// sur folderPath() (chemin relatif à la page), ferait 404 sur emulator.min.css,
// puis "EmulatorJS is not defined" (la classe vit dans emulator.min.js jamais chargé).
// Solution : on pose TOUTES les variables EJS_* puis on injecte loader.js dynamiquement.
function say(msg, ms = 4500) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#000d;color:#fff;border:1px solid #7CFC00;border-radius:8px;padding:8px 14px;z-index:99;font:13px system-ui';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
  return t;   // retourne l'élément pour pouvoir le retirer manuellement (ex: EJS_ready)
}
async function start() {
  if (!romBlob || started) return;
  started = true;
  $('home').hidden = true;
  $('game').classList.add('show');
  lockScreen(); tryFs();

  // Indicateur de chargement persistant (la 1re session télécharge plusieurs Mo :
  // emulator.min.js + le cœur .data. Si on n'affiche rien, l'utilisateur croit que
  // ça a planté et refresh — d'où la sensation de "devoir débloquer" la 1re fois).
  const loader = say(t('loading_ejs'), 60000);

  // 1) Toutes les variables EJS_* AVANT l'injection de loader.js
  const core = $('sys').value;
  // Utilise le Blob directement : 4.2.3 sait le lire sans requête sur une URL blob:.
  // slice() retourne un Blob et non un File : après lecture, EmulatorJS utilise
  // EJS_gameName pour conserver les mêmes noms de sauvegarde qu'auparavant.
  // FBNeo attend l'archive intacte avec son nom complet (romset.zip).
  const arcadeLike = (core === 'arcade' || core === 'mame');
  window.EJS_player          = '#game';
  window.EJS_core            = core;
  window.EJS_gameUrl         = romBlob.slice();
  window.EJS_gameName        = arcadeLike ? romName : romName.replace(/\.[^.]+$/, '');
  window.EJS_pathtodata      = DATA_URL.href;
  window.EJS_startOnLoaded   = true;
  window.EJS_color           = '#7CFC00';
  window.EJS_backgroundColor = '#050506';
  window.EJS_language        = 'en-US';   // l'UI d'EmulatorJS reste en anglais
  window.EJS_disableAutoLang = false;     // évite le fetch 404 de localization/<lang>.json
  // Callback "ready" : retire l'indicateur + enregistre les hooks save/load state.
  window.EJS_ready           = () => { if (loader) loader.remove(); registerStateHooks(window.EJS_emulator); };
  // Bouton Exit du menu EmulatorJS : PATCHÉ dans data/emulator.min.js (auto-hébergé)
  // pour appeler window.RetroExit() au lieu de la popup bloquante "EmulatorJS has exited".
  // (loader.js ne branche jamais EJS_onExit — le hook était mort-né, d'où le patch direct.)
  window.RetroExit = goHome;

  // 2) Injection dynamique de loader.js — il lit les vars ci-dessus à l'exécution
  const s = document.createElement('script');
  s.src = new URL('loader.js', DATA_URL).href;
  s.async = false;
  s.onerror = () => {
    loader.remove();
    say(t('load_failed') + ' ' + s.src);
  };
  document.head.appendChild(s);
}

// ---- Plein écran auto ----
async function tryFs() {
  try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch {}
  try { await screen.orientation.lock('landscape'); } catch {}
}
function goHome() {
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch {}
  try { screen.orientation.unlock(); } catch {}
  location.reload();   // détruit l'émulateur + revient à l'accueil (même chemin que le bouton ✕)
}
$('exitBtn').onclick = goHome;

// ---- Écran allumé pendant la partie ----
let wl = null;
async function lockScreen() {
  try { if ('wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.onrelease = () => wl = null; } } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') lockScreen(); });
addEventListener('pointerdown', lockScreen, { passive: true });

// ---- Service worker + màj auto ----
// Le SW met index.html en network-first : une màj poussée sur GitHub est donc
// récupérée au lancement suivant. On écoute en plus :
//   - updatefound → nouveau SW en cours d'installation
//   - state 'installed' + controller existant → nouveau SW "waiting" → on propose
//     un bouton "Màj disponible" ; l'utilisateur valide → on envoie SKIP_WAITING
//   - controllerchange → reload (une seule fois) pour basculer sur la nouvelle version
let refreshing = false;
function showUpdate(onApply) {
  if ($('updApply')) return;   // un seul bouton à la fois
  const b = document.createElement('button');
  b.id = 'updApply'; b.className = 'primary';
  b.textContent = t('update_available');
  b.style.cssText = 'margin-top:8px';
  b.onclick = () => { b.remove(); onApply(); };
  $('updSlot').appendChild(b);
}
async function initSW() {
  if (!('serviceWorker' in navigator)) return;
  let reg;
  try { reg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }); }
  catch (e) { console.warn(e); return; }

  reg.addEventListener('updatefound', () => {
    const newSW = reg.installing;
    if (!newSW) return;
    newSW.addEventListener('statechange', () => {
      if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
        // Nouveau SW prêt et en attente → propose l'activation immédiate.
        showUpdate(() => newSW.postMessage({ type: 'SKIP_WAITING' }));
      }
    });
  });

  // Recharge une seule fois quand le nouveau SW prend le contrôle.
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    location.reload();
  });

  // Cas où un SW attendait déjà au chargement (page ouverte avant la màj).
  if (reg.waiting && navigator.serviceWorker.controller) {
    showUpdate(() => reg.waiting.postMessage({ type: 'SKIP_WAITING' }));
  }
}
// Vérification manuelle : force le navigateur à re-demander sw.js au réseau.
$('bUpd').onclick = async () => {
  if (!('serviceWorker' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update();
    say(t('check_done'));
  } catch (e) { console.warn(e); say(t('check_failed')); }
};
initSW();
</script>
</body>
</html>
